# Extra autostart processes
# exec-once = uwsm-app -- my-service

# autostart blanket
exec-once = [workspace special:bg silent] uwsm-app -- blanket & sleep 5 && hyprctl dispatch closewindow "class:^(com.rafaelmardojai.Blanket)$"

# brightness gamma control
exec-once = wl-gammarelay-rs

# EasyEffects
exec-once = killall easyeffects; uwsm app -- easyeffects --gapplication-service

# Nightlight
exec-once = uwsm app -- hyprsunset
