# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --disable-gpu
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bitwarden-desktop
bindd = SUPER, M, Music selector - Waybar, exec, bash ~/.config/waybar/mpris-select.sh

# Power Menu
bindd = SUPER, Home, Power Menu, exec, omarchy-menu system

# Global Media Controls for Pinned Waybar Player
bindd = SUPER, n, Next, exec, ~/.config/waybar/mpris-control.sh next
bindd = SUPER, b, Previous, exec, ~/.config/waybar/mpris-control.sh prev
bindd = SUPER, period, Play/Pause, exec, ~/.config/waybar/mpris-control.sh toggle

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
# bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/u/2/r"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.google.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
bindd = SUPER, semicolon, Emoji Picker, exec, omarchy-launch-walker -m symbols  # Emoji Button

# GTBook Controls
bindd = , XF86ScrollDown, Office Mode, exec, sudo laptopfunctions mode office && sudo laptopfunctions rgb --battery-mode && powerprofilesctl set power-saver

# Using the unidentified hardware key (Key code 184) - MUST use "code:" prefix
bindd = , code:184, Performance Mode, exec, sudo laptopfunctions mode performance && powerprofilesctl set balanced

# Using the Sleep key (Key code 150)
bindd = , XF86Sleep, Gaming Mode, exec, sudo laptopfunctions mode gaming && sudo laptopfunctions rgb --ac-mode && powerprofilesctl set performance

# Toggle rgb modes
bindd = SUPER, F3, Toggle GT Book RGB, exec, ~/.local/bin/gtbook-rgb-toggle
bindd = SUPER CTRL, F3, Toggle keyboard RGB Modes, exec, ~/.local/bin/keybd -c

# Unbind Omarchy's default brightness controls
unbind = ,XF86MonBrightnessDown
unbind = ,XF86MonBrightnessUp

# Custom brightness Controls
bindel = ,XF86MonBrightnessDown, exec, ~/.local/bin/omarchy-brightness-wrapper 5%-
bindel = ,XF86MonBrightnessUp, exec, ~/.local/bin/omarchy-brightness-wrapper +5%

# Go Beyond 10 workspaces
bindd = SUPER ALT, EQUAL, Go to workpsace, exec, notify-send -t 0 " Go to workspace" "Type number + Enter\n(Esc to cancel)" && hyprctl dispatch submap workspace-go-to
bindd = SUPER SHIFT ALT, EQUAL, Move active window to workspace, exec, notify-send -t 0 " Move window to workspace" "Type number + Enter\n(Esc to cancel)" && hyprctl dispatch submap workspace-move-to

submap = workspace-go-to
bind = , 0, exec, ~/scripts/workspace-beyond-10 go-to 0
bind = , 1, exec, ~/scripts/workspace-beyond-10 go-to 1
bind = , 2, exec, ~/scripts/workspace-beyond-10 go-to 2
bind = , 3, exec, ~/scripts/workspace-beyond-10 go-to 3
bind = , 4, exec, ~/scripts/workspace-beyond-10 go-to 4
bind = , 5, exec, ~/scripts/workspace-beyond-10 go-to 5
bind = , 6, exec, ~/scripts/workspace-beyond-10 go-to 6
bind = , 7, exec, ~/scripts/workspace-beyond-10 go-to 7
bind = , 8, exec, ~/scripts/workspace-beyond-10 go-to 8
bind = , 9, exec, ~/scripts/workspace-beyond-10 go-to 9
bind = , Return, exec, ~/scripts/workspace-beyond-10 go-to enter
bind = , Escape, exec, ~/scripts/workspace-beyond-10 go-to escape
submap = reset

submap = workspace-move-to
bind = , 0, exec, ~/scripts/workspace-beyond-10 move-to 0
bind = , 1, exec, ~/scripts/workspace-beyond-10 move-to 1
bind = , 2, exec, ~/scripts/workspace-beyond-10 move-to 2
bind = , 3, exec, ~/scripts/workspace-beyond-10 move-to 3
bind = , 4, exec, ~/scripts/workspace-beyond-10 move-to 4
bind = , 5, exec, ~/scripts/workspace-beyond-10 move-to 5
bind = , 6, exec, ~/scripts/workspace-beyond-10 move-to 6
bind = , 7, exec, ~/scripts/workspace-beyond-10 move-to 7
bind = , 8, exec, ~/scripts/workspace-beyond-10 move-to 8
bind = , 9, exec, ~/scripts/workspace-beyond-10 move-to 9
bind = , Return, exec, ~/scripts/workspace-beyond-10 move-to enter
bind = , Escape, exec, ~/scripts/workspace-beyond-10 move-to escape
submap = reset

# Full width fullscreen
bindd = SUPER, D, Full width, fullscreen, 1
